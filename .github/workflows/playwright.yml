name: TaskMaster Playwright E2E

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Швидка перевірка коду автотестів (~10-15 сек): ESLint + TypeScript TypeCheck
  quality-check:
    name: Tests Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e-tests/package-lock.json

      - name: Install E2E Test dependencies
        working-directory: e2e-tests
        run: npm ci

      - name: TypeScript Check (no emit)
        working-directory: e2e-tests
        run: npm run typecheck

      - name: ESLint (Playwright best practices)
        working-directory: e2e-tests
        run: npm run lint

  # 2. Перевірка безпеки сторонніх пакетів (~10 сек)
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit app & test dependencies
        run: |
          npm audit --audit-level=high
          cd e2e-tests && npm audit --audit-level=high

  # 3. Запуск Playwright E2E тестів (стартує лише після успішних швидких перевірок)
  test:
    name: Run E2E Tests
    needs: [quality-check, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            e2e-tests/package-lock.json

      # Install app dependencies
      - name: Install Target App dependencies
        run: npm ci

      # Install Playwright test dependencies
      - name: Install E2E Test dependencies
        working-directory: e2e-tests
        run: npm ci

      # Get Playwright version for browser cache key
      - name: Get Playwright version
        id: playwright-version
        working-directory: e2e-tests
        run: echo "version=$(npx playwright --version)" >> $GITHUB_OUTPUT

      # Cache Playwright browser binaries
      - name: Cache Playwright Browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Install Chromium only if cache missed
      - name: Install Playwright Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: e2e-tests
        run: npx playwright install --with-deps chromium

      # If browser cache hit, ensure system OS dependencies are present
      - name: Install Playwright OS Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: e2e-tests
        run: npx playwright install-deps chromium

      # Execute Playwright tests (Playwright automatically starts & stops webServer as configured in playwright.config.ts)
      - name: Run Playwright tests
        working-directory: e2e-tests
        run: npm test

      # Upload HTML test report
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e-tests/playwright-report/
          retention-days: 14
